<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR 法律法规知识库 | 月度更新监控</title>
    <style>
        :root {
            --bg: #141413;
            --bg-card: #232320;
            --bg-secondary: #1a1a18;
            --text: #faf9f5;
            --text-secondary: #b0aea5;
            --text-muted: #7a7872;
            --accent: #c96442;
            --accent-light: #d97757;
            --accent-hover: #b55a3c;
            --accent-success: #10b981;
            --accent-warning: #f59e0b;
            --accent-danger: #ef4444;
            --border: #30302e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.7;
            min-height: 100vh;
        }
        .navbar {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(20, 20, 19, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
        }
        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 64px;
        }
        .nav-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text);
            font-weight: 700;
            font-size: 1.1rem;
            text-decoration: none;
        }
        .nav-brand-icon {
            width: 32px;
            height: 32px;
            background: var(--accent);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }
        .nav-links {
            display: flex;
            gap: 32px;
        }
        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.2s ease;
        }
        .nav-links a:hover, .nav-links a.active {
            color: var(--accent);
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 60px 24px 80px;
        }
        .header {
            text-align: center;
            margin-bottom: 48px;
        }
        .header h1 {
            font-size: 42px;
            font-weight: 700;
            margin-bottom: 16px;
            letter-spacing: -0.03em;
        }
        .header p {
            font-size: 18px;
            color: var(--text-secondary);
            max-width: 700px;
            margin: 0 auto;
        }
        .meta-bar {
            display: flex;
            justify-content: center;
            gap: 24px;
            flex-wrap: wrap;
            margin-bottom: 48px;
            color: var(--text-muted);
            font-size: 14px;
        }
        .meta-bar span {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-ok { background: rgba(16, 185, 129, 0.15); color: var(--accent-success); }
        .status-update { background: rgba(249, 115, 22, 0.15); color: var(--accent-warning); }
        .status-error { background: rgba(239, 68, 68, 0.15); color: var(--accent-danger); }
        .section-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .section-title .icon {
            width: 32px;
            height: 32px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }
        .laws-grid {
            display: grid;
            gap: 16px;
        }
        .law-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            transition: border-color 0.2s ease, transform 0.2s ease;
        }
        .law-card:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }
        .law-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
            margin-bottom: 12px;
        }
        .law-card h3 {
            font-size: 18px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 4px;
        }
        .law-card .law-meta {
            font-size: 13px;
            color: var(--text-muted);
        }
        .law-card p {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 12px;
        }
        .law-card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .law-card a {
            color: var(--accent-light);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }
        .law-card a:hover {
            text-decoration: underline;
        }
        .history-section {
            margin-top: 64px;
        }
        .history-list {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
        }
        .history-item {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }
        .history-item:last-child {
            border-bottom: none;
        }
        .history-item .date {
            color: var(--text-muted);
            font-size: 13px;
            min-width: 100px;
        }
        .history-item .event {
            color: var(--text-secondary);
            font-size: 14px;
            flex: 1;
        }
        .footer {
            text-align: center;
            padding: 40px 24px;
            color: var(--text-muted);
            font-size: 14px;
            border-top: 1px solid var(--border);
            margin-top: 80px;
        }
        .footer a {
            color: var(--accent-light);
            text-decoration: none;
        }
        @media (max-width: 768px) {
            .header h1 { font-size: 32px; }
            .nav-links { display: none; }
            .law-card-header { flex-direction: column; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-brand">
                <span class="nav-brand-icon">HR</span>
                <span>HR 法规知识库</span>
            </a>
            <div class="nav-links">
                <a href="index.html" class="active">法规清单</a>
                <a href="#history">更新记录</a>
                <a href="https://github.com/hosamzj/hr-compliance">GitHub</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="header">
            <h1>HR 法律法规知识库</h1>
            <p>跟踪中国大陆劳动、社保、用工相关法律法规，每月自动检查官方来源更新，并推送通知。</p>
        </div>

        <div class="meta-bar">
            <span>📅 每月 1 日 09:00 自动检查</span>
            <span>🔔 微信 + 邮件通知</span>
            <span>📧 sam.huo@te.com</span>
            <span class="status-badge status-ok">● 监控运行中</span>
        </div>

        <section class="laws-section">
            <h2 class="section-title">
                <span class="icon">⚖️</span>
                跟踪法规清单
            </h2>
            <div class="laws-grid" id="laws-grid">
                <!-- 由 JavaScript 从 data/laws.json 渲染 -->
            </div>
        </section>

        <section class="history-section" id="history">
            <h2 class="section-title">
                <span class="icon">📝</span>
                更新记录
            </h2>
            <div class="history-list" id="history-list">
                <div class="history-item">
                    <span class="date">2026-07-31</span>
                    <span class="event">知识库初始化，开始监控 7 部核心法律法规。</span>
                </div>
            </div>
        </section>
    </div>

    <footer class="footer">
        <p>由 Hermes Agent 自动生成与维护 · 数据仅供参考，请以官方发布文本为准</p>
        <p>官方来源：国家法律法规数据库、人社部、国务院</p>
        <p><a href="https://github.com/hosamzj/hr-compliance">github.com/hosamzj/hr-compliance</a></p>
    </footer>

    <script>
        async function loadData() {
            try {
                const [lawsRes, historyRes] = await Promise.all([
                    fetch('data/laws.json'),
                    fetch('data/history.json')
                ]);
                const lawsData = await lawsRes.json();
                const historyData = await historyRes.json();

                // Render laws
                const grid = document.getElementById('laws-grid');
                lawsData.laws.forEach(law => {
                    const card = document.createElement('div');
                    card.className = 'law-card';
                    const statusClass = law.status === 'updated' ? 'status-update' : (law.status === 'error' ? 'status-error' : 'status-ok');
                    const statusText = law.status === 'updated' ? '有更新' : (law.status === 'error' ? '检查失败' : '无更新');
                    card.innerHTML = `
                        <div class="law-card-header">
                            <div>
                                <h3>${law.name}</h3>
                                <div class="law-meta">${law.issuer || ''} · ${law.effective_date || '现行有效'}</div>
                            </div>
                            <span class="status-badge ${statusClass}">● ${statusText}</span>
                        </div>
                        <p>${law.description}</p>
                        <div class="law-card-footer">
                            <a href="${law.url}" target="_blank" rel="noopener">查看官方来源 →</a>
                            <span class="law-meta">上次检查：${law.last_checked || '未检查'}</span>
                        </div>
                    `;
                    grid.appendChild(card);
                });

                // Render history
                const historyList = document.getElementById('history-list');
                historyList.innerHTML = '';
                (historyData.events || []).forEach(event => {
                    const item = document.createElement('div');
                    item.className = 'history-item';
                    item.innerHTML = `
                        <span class="date">${event.date}</span>
                        <span class="event">${event.event}</span>
                    `;
                    historyList.appendChild(item);
                });
            } catch (err) {
                document.getElementById('laws-grid').innerHTML = '<p style="color:var(--text-secondary)">加载法规数据失败，请稍后刷新。</p>';
                console.error(err);
            }
        }
        loadData();
    </script>
</body>
</html>
